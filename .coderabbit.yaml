# CodeRabbit Configuration
# Enables automatic code reviews on both default branch (main) and staging branch

reviews:
  # Skip tooling/design exports from AI review (helps stay under per-PR file limits)
  path_filters:
    - "!apps/storefront/design-assets/**"
  auto_review:
    enabled: true
    base_branches:
      - "main"      # Production branch (default)
      - "staging"   # Staging/development branch
    auto_incremental_review: true
    drafts: false
  review_status: true
  review_details: true
  high_level_summary: true
