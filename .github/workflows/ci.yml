name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  sdd-sanity:
    name: SDD Sanity Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate git-config.json
        run: |
          if [ ! -f .sdd/git-config.json ]; then
            echo "❌ .sdd/git-config.json is missing"
            exit 1
          fi
          
          # Validate JSON syntax
          node -e "JSON.parse(require('fs').readFileSync('.sdd/git-config.json', 'utf8'))" || {
            echo "❌ .sdd/git-config.json is not valid JSON"
            exit 1
          }
          
          # Validate required fields
          DEFAULT_BRANCH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.sdd/git-config.json', 'utf8')).default_branch || '')")
          PROD_BRANCH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.sdd/git-config.json', 'utf8')).production_branch || '')")
          
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "❌ .sdd/git-config.json missing 'default_branch' field"
            exit 1
          fi
          
          if [ -z "$PROD_BRANCH" ]; then
            echo "❌ .sdd/git-config.json missing 'production_branch' field"
            exit 1
          fi
          
          echo "✅ .sdd/git-config.json is valid"
          echo "   default_branch: $DEFAULT_BRANCH"
          echo "   production_branch: $PROD_BRANCH"

      - name: Validate Helper Metadata
        run: |
          if [ -f .cursor/scripts/validate-helpers.cjs ]; then
            node .cursor/scripts/validate-helpers.cjs || {
              echo "❌ Helper metadata validation failed"
              exit 1
            }
          else
            echo "⚠️  validate-helpers.cjs not found, skipping"
          fi

      - name: Check Spec Files Exist
        run: |
          # For PRs, GITHUB_REF_NAME is the head branch; use base ref when available.
          TARGET_BRANCH="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

          REQUIRED_SPECS=(
            "spec/00-root-spec.md"
            "spec/08-infrastructure.md"
          )

          # work/backlog is development-only (kept on staging). Require it only when:
          # - targeting staging, OR
          # - the files exist in the checked-out ref.
          if [ "$TARGET_BRANCH" = "staging" ] || [ -f "work/backlog/milestones.md" ]; then
            REQUIRED_SPECS+=(
              "work/backlog/milestones.md"
              "work/backlog/tasks.local.md"
            )
          else
            echo "ℹ️  Skipping work/backlog spec checks on non-staging branch ($TARGET_BRANCH)."
          fi
          
          MISSING=0
          for spec in "${REQUIRED_SPECS[@]}"; do
            if [ ! -f "$spec" ]; then
              echo "❌ Missing required spec file: $spec"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi
          
          echo "✅ All required spec files present"

  test-commerce:
    name: Test Commerce Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Commerce unit tests
        working-directory: apps/commerce
        run: pnpm test:unit
        continue-on-error: true

  typecheck-storefront:
    name: Typecheck Storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Storefront
        working-directory: apps/storefront
        run: pnpm typecheck
